<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="../../assets/icons/logo.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class | CyberGuard</title>
    <link rel="stylesheet" href="../admin/style.min.css" />
  </head>
  <body data-page="class">
    <header class="site-header">
      <a class="brand" href="../admin/"><picture><source srcset="../../assets/icons/logo.webp" type="image/webp"><img class="logo-mark" src="../../assets/icons/logo.png" alt="CyberGuard shield logo" width="40" height="40" decoding="async" /></picture><span class="logo-text">CyberGuard</span></a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" data-nav-toggle><span></span><span></span><span></span></button>
      <nav class="main-nav" data-nav>
        <a class="main-nav-link nav-profile" href="../profile/"><span class="nav-icon" aria-hidden="true"></span><span>Profile</span></a>
        <a class="main-nav-link nav-home" href="../admin/"><span class="nav-icon" aria-hidden="true"></span><span>Home</span></a>
        <a class="main-nav-link nav-about" href="../../index.html#about"><span class="nav-icon" aria-hidden="true"></span><span>About Us</span></a>
      </nav>
    </header>
    <main class="page-shell">
      <section class="panel">
        <p class="eyebrow">Class Lessons</p>
        <h1 class="page-title">Class</h1>
      </section>

      <section class="admin-class-workspace class-page-workspace" style="margin-top: 18px;">
        <aside class="panel class-list-panel">
          <div class="panel-heading">
            <p class="eyebrow">Select Class / Section</p>
            <h2>Class List</h2>
          </div>
          <div class="class-list" data-class-list></div>
        </aside>

        <section class="module-view lessons-panel">
          <div class="module-toolbar">
            <div>
              <p class="eyebrow">Lessons</p>
              <h2 data-lesson-title>Choose A Class</h2>
            </div>
            <div class="tool-icons">
              <label class="lesson-episode-picker">
                <span>Upload to</span>
                <select data-lesson-episode>
                  <option value="episode0">Episode 0</option>
                  <option value="episode1">Episode 1</option>
                </select>
              </label>
              <label class="btn primary upload-btn">
                <input type="file" accept=".pdf,.docx,.ppt,.pptx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation" data-lesson-upload hidden />
                Upload
              </label>
            </div>
          </div>
          <div class="lesson-dropzone">
            <div class="selected-class-card" data-selected-class></div>
            <div class="list-stack" data-lesson-list></div>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="./script.min.js"></script>
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </body>
</html>
