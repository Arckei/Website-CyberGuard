<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberGuard Game</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030405; color: #f2f4f5; font-family: Arial, sans-serif; }
      #game-shell { position: relative; width: 100%; height: 100%; min-height: 420px; background: #030405; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #030405; }
      #download-gate { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 24px; background: rgba(3, 4, 5, .96); }
      #download-gate.hidden { display: none; }
      .gate-panel { width: min(520px, 100%); padding: 32px; border: 1px solid #ff303c; border-radius: 8px; background: #0e1114; box-shadow: 0 0 28px rgba(255, 48, 60, .2); }
      .kicker { margin: 0 0 8px; color: #d9aa6a; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 0 0 14px; font-size: clamp(22px, 4vw, 32px); }
      .description { color: #c5cbd1; line-height: 1.5; }
      strong, .size { color: #d9aa6a; }
      #start-game { margin-top: 12px; padding: 12px 16px; border: 1px solid #ff303c; border-radius: 5px; background: rgba(255, 48, 60, .12); color: #fff; cursor: pointer; font: inherit; }
      #start-game:disabled { cursor: wait; opacity: .7; }
      #progress { position: absolute; left: 50%; bottom: 28px; width: min(280px, 70%); height: 8px; transform: translateX(-50%); overflow: hidden; border: 1px solid #2b3036; border-radius: 4px; background: #171b1f; }
      #progress-fill { width: 0; height: 100%; background: #ff303c; transition: width .15s ease; }
      #status { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); color: #9aa3ad; font-size: 13px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <main id="game-shell">
      <div id="download-gate">
        <section class="gate-panel">
          <p class="kicker" id="episode-label">Episode</p>
          <h1 id="episode-title">CyberGuard Game</h1>
          <p class="description">This game downloads <strong id="download-size"></strong> the first time you start it and is then saved in your browser on this device.</p>
          <button id="start-game" type="button">Download and Start Game <span class="size" id="button-size"></span></button>
        </section>
      </div>
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <p id="status" hidden>Downloading game...</p>
      <div id="progress" hidden><div id="progress-fill"></div></div>
    </main>
    <script>
      const episode = new URLSearchParams(window.location.search).get("episode") === "1" ? "1" : "0";
      const config = episode === "1"
        ? { label: "Episode 1", title: "CyberGuard Episode 1", size: "77.5 MB", folder: "Ep 1", name: "CyberGuard Ep1 v1.00" }
        : { label: "Episode 0", title: "CyberGuard Tutorial", size: "76.0 MB", folder: "Ep 0", name: "CyberGuard Ep0 v1.02" };
      const root = `./${config.folder}/Build`;
      const gate = document.querySelector("#download-gate");
      const button = document.querySelector("#start-game");
      const status = document.querySelector("#status");
      const progress = document.querySelector("#progress");
      const progressFill = document.querySelector("#progress-fill");

      document.querySelector("#episode-label").textContent = config.label;
      document.querySelector("#episode-title").textContent = config.title;
      document.querySelector("#download-size").textContent = config.size;
      document.querySelector("#button-size").textContent = config.size;

      button.addEventListener("click", () => {
        button.disabled = true;
        button.textContent = "Downloading...";
        gate.classList.add("hidden");
        status.hidden = false;
        progress.hidden = false;

        const script = document.createElement("script");
        script.src = `${root}/${config.name}.loader.js`;
        script.onload = () => {
          createUnityInstance(document.querySelector("#unity-canvas"), {
            dataUrl: `${root}/${config.name}.data`,
            frameworkUrl: `${root}/${config.name}.framework.js`,
            codeUrl: `${root}/${config.name}.wasm`,
            companyName: "CyberGuard",
            productName: config.title,
            productVersion: "1.0"
          }, (value) => {
            progressFill.style.width = `${Math.round(value * 100)}%`;
          }).then(() => {
            status.hidden = true;
            progress.hidden = true;
          }).catch(() => {
            gate.classList.remove("hidden");
            status.textContent = "The game failed to load. Please try again.";
            button.disabled = false;
            button.textContent = "Try Again";
          });
        };
        script.onerror = () => {
          gate.classList.remove("hidden");
          status.textContent = "The game failed to download. Please try again.";
          button.disabled = false;
          button.textContent = "Try Again";
        };
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
