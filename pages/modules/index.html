<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modules | CyberGuard</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-page="modules">
    <a class="floating-back" href="../user/" aria-label="Go back">←</a>
    <header class="site-header">
      <a class="brand" href="../user/"><span class="logo-mark">CG</span><span class="logo-text">CyberGuard</span></a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" data-nav-toggle><span></span><span></span><span></span></button>
      <nav class="main-nav" data-nav>
        <a href="../profile/">Profile</a>
        <a href="../user/">Home</a>
        <a href="../../index.html#about">About Us</a>
      </nav>
    </header>
    <main class="page-shell">
      <section class="module-layout">
        <aside class="module-list">
          <h2>Module List</h2>
          <div class="episode-item" data-episode="episode1">
            <button class="episode-toggle" type="button" data-episode-toggle>
              <span class="episode-toggle-left">
                <span class="episode-ring" data-episode-ring>
                  <svg viewBox="0 0 36 36" aria-hidden="true">
                    <circle class="ring-track" cx="18" cy="18" r="15.5"></circle>
                    <circle class="ring-fill" data-ring-fill cx="18" cy="18" r="15.5"></circle>
                  </svg>
                  <svg class="ring-check" data-ring-check viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 13l4 4L19 7" />
                  </svg>
                </span>
                <span class="episode-name">Episode One</span>
              </span>
              <span class="episode-status" data-episode-status>In progress</span>
            </button>
            <div class="episode-tasks" data-episode-tasks hidden>
              <ul class="task-list" data-task-list></ul>
              <p class="lesson-section-label">Lesson Files</p>
              <ul class="task-list lesson-task-list" data-lesson-task-list>
                <li class="muted">Loading lessons&hellip;</li>
              </ul>
            </div>
          </div>
        </aside>
        <section class="module-view">
          <div class="module-toolbar">
            <div class="tool-icons">
              <span class="muted" data-game-title>Episode One</span>
            </div>
            <button class="icon-btn" type="button" title="Fullscreen" data-unity-fullscreen>↗</button>
          </div>
          <div class="unity-embed" data-unity-embed>
            <div class="unity-loading" data-unity-loading>
              <div class="unity-loading-bar-track">
                <div class="unity-loading-bar-fill" data-unity-progress></div>
              </div>
              <p class="muted">Loading game&hellip;</p>
            </div>
            <canvas id="unity-canvas" tabindex="-1"></canvas>
          </div>
        </section>
      </section>
    </main>

    <div class="lesson-modal-overlay" data-lesson-modal hidden>
      <div class="lesson-modal" role="dialog" aria-modal="true">
        <div class="lesson-modal-topbar">
          <span class="lesson-modal-file-icon" data-lesson-modal-icon>DOCX</span>
          <span class="lesson-modal-title" data-lesson-modal-title>Document</span>
          <a class="lesson-modal-open-new" data-lesson-modal-open target="_blank" rel="noopener">Open in new tab</a>
          <button class="lesson-modal-close" data-lesson-modal-close type="button" aria-label="Close">✕</button>
        </div>
        <div class="lesson-modal-body" data-lesson-modal-body></div>
      </div>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
