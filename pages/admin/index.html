<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="../../assets/icons/logo.png" />

    <title>Admin | CyberGuard</title>

      <a class="brand" href="../admin/"><img class="logo-mark" src="../../assets/icons/logo.png" alt="CyberGuard shield logo" /><span class="logo-text">CyberGuard</span></a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" data-nav-toggle><span></span><span></span><span></span></button>
